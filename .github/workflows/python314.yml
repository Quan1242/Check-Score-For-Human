name: Python 3.14 compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes pnpm@10.11.0 install --frozen-lockfile
        working-directory: frontend
      - run: npx --yes pnpm@10.11.0 test
        working-directory: frontend
      - run: npx --yes pnpm@10.11.0 build
        working-directory: frontend
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.in
            backend/requirements*.txt
      - run: python -m pip install --only-binary=:all: -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: python -c "import psycopg; from psycopg import pq; assert pq.__impl__ == 'binary'; print(psycopg.__version__, pq.version())"
      - run: python -m pytest -q -W error
        working-directory: backend

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-m49}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m49_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-m49}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-m49}:${POSTGRES_PASSWORD:-m49_local_dev}@db:5432/${POSTGRES_DB:-m49}
      STORAGE_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
volumes:
  postgres_data:
  uploads:
